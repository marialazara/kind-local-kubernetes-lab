kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-lab

# Opções de rede para cenários mais avançados:
# networking:
#   apiServerAddress: "127.0.0.1"
#   apiServerPort: 6443
#   podSubnet: "10.244.0.0/16"
#   serviceSubnet: "10.96.0.0/12"

nodes:
- role: control-plane
  # O kind cria cada node como um container Docker.
  # Este containerPort pertence ao node do kind, não ao container da aplicação.
  # Ele recebe o tráfego do NodePort 30080.
  extraPortMappings:
  - containerPort: 30080
    # Porta do computador usada pelo navegador: localhost:8080.
    hostPort: 8080
    # Aceita conexões somente da própria máquina.
    # Use 0.0.0.0 apenas se precisar aceitar conexões externas.
    listenAddress: "127.0.0.1"
    # Protocolo usado pelo encaminhamento. TCP é o padrão para HTTP.
    protocol: TCP

# Para adicionar workers ao laboratório, descomente e repita este bloco:
# - role: worker
#
# Exemplo de uma segunda porta publicada no host:
#   extraPortMappings:
#   - containerPort: 30081
#     hostPort: 8081
#     listenAddress: "127.0.0.1"
#     protocol: TCP
